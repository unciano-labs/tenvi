name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Lint, Design & Build Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Enforce Design Rules (Borders & Gradients)
        run: npm run check:design

      - name: Audit UI & Responsive Layouts
        run: npm run test:ui

      - name: Type Check & Build
        run: npm run build
